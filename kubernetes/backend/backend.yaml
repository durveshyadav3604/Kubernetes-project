apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: bags-luggage
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: backend
          image: 264284392886.dkr.ecr.ap-south-1.amazonaws.com/luggage-bag-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: PORT
            - name: SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: SERVER_URL
            # Auto-generated by the MongoDB Community Operator once the
            # MongoDBCommunity resource reconciles — contains the full,
            # correctly URL-encoded connection string. Verify the exact
            # secret name with: kubectl get secrets -n bags-luggage | grep mongodb
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-admin-admin
                  key: connectionString.standard
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: bags-luggage
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP