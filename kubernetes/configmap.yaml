apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: bags-luggage
  labels:
    app: backend
data:
  PORT: "5000"
  # Replace with your actual public-facing URL (Ingress host / domain).
  # Used by the backend for things like CORS origin, generating links, etc.
  SERVER_URL: "http://localhost:5000"