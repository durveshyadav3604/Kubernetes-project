apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bags-luggage
  labels:
    app: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: frontend
          # NOTE: REACT_APP_API_URL is baked into the JS bundle at
          # `npm run build` time via the Dockerfile ARG. Setting it here
          # as a container env var has NO effect at runtime.
          # Rebuild and push the image with:
          #   docker build --build-arg REACT_APP_API_URL=https://<your-ingress-host>/api -t <repo>:<tag> .
          image: 264284392886.dkr.ecr.ap-south-1.amazonaws.com/luggage-bag-app-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: bags-luggage
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP